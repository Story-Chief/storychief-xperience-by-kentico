name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-format:
    name: .Net Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Run dotnet format
        run: dotnet format StoryChief.Xperience.slnx --exclude ./examples/** --verify-no-changes

  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: dotnet-format

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install dependencies
        run: dotnet restore --locked-mode

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Test Solution
        run: dotnet test --configuration Release --no-build --no-restore

      - name: Pack NuGet package
        run: dotnet pack src/StoryChief.Xperience/StoryChief.Xperience.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Resolve package version
        id: package
        run: echo "version=$(dotnet msbuild src/StoryChief.Xperience/StoryChief.Xperience.csproj -getProperty:PackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Prepare package installation test
        run: cp -R tests/StoryChief.Xperience.PackageConsumer /tmp/storychief-package-consumer

      - name: Restore package consumer
        run: dotnet restore /tmp/storychief-package-consumer --source "${{ github.workspace }}/artifacts" --source https://api.nuget.org/v3/index.json -p:StoryChiefPackageVersion=${{ steps.package.outputs.version }}

      - name: Build package consumer
        run: dotnet build /tmp/storychief-package-consumer --configuration Release --no-restore -p:StoryChiefPackageVersion=${{ steps.package.outputs.version }}
